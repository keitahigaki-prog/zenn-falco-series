<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans JP','Inter',sans-serif">
  <defs>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748B"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="420" fill="#FFFFFF"/>
  <text x="450" y="36" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">図1-2　観測できる範囲と、その境界</text>

  <rect x="60" y="60" width="780" height="330" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="90" y="86" font-size="14" font-weight="600" fill="#0F172A">観測できる範囲</text>

  <rect x="100" y="106" width="700" height="78" rx="8" fill="#FFFFFF" stroke="#06B6D4" stroke-width="2"/>
  <text x="450" y="132" font-size="14" fill="#1E293B" text-anchor="middle">Falco（ノード上のeBPF）</text>
  <text x="450" y="152" font-size="12" fill="#1E293B" text-anchor="middle">syscall: exec / open / connect 等</text>
  <text x="450" y="170" font-size="12" fill="#1E293B" text-anchor="middle">→ Pod内・ホスト内の挙動</text>

  <path d="M450,184 L450,212" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowGray)"/>
  <rect x="470" y="188" width="60" height="20" fill="#F8FAFC" opacity="0.95"/>
  <text x="474" y="203" font-size="12" fill="#64748B">見えない</text>

  <rect x="100" y="212" width="700" height="60" rx="8" fill="#FFFFFF" stroke="#06B6D4" stroke-width="2"/>
  <text x="450" y="238" font-size="14" fill="#1E293B" text-anchor="middle">Kubernetes Audit Logs</text>
  <text x="450" y="256" font-size="12" fill="#1E293B" text-anchor="middle">→ APIサーバへの操作（kubectl等）</text>

  <path d="M450,272 L450,300" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowGray)"/>
  <rect x="470" y="276" width="60" height="20" fill="#F8FAFC" opacity="0.95"/>
  <text x="474" y="291" font-size="12" fill="#64748B">見えない</text>

  <rect x="100" y="300" width="700" height="72" rx="8" fill="#FFFFFF" stroke="#06B6D4" stroke-width="2"/>
  <text x="450" y="326" font-size="14" fill="#1E293B" text-anchor="middle">クラウドAudit Trail（CloudTrail / Cloud Audit Logs）</text>
  <text x="450" y="346" font-size="12" fill="#1E293B" text-anchor="middle">→ IAM・マネージドAPIの操作</text>

</svg>

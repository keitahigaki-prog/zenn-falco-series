  <path d="M500,120 L500,148" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Part1 nodes -->
  <rect x="90" y="196" width="260" height="50" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>

  <text x="780" y="476" font-size="13" fill="#1E293B" text-anchor="middle">第6章：Privilege Escalation</text>
  <path d="M350,471 L370,471" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <path d="M630,471 L650,471" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <path d="M780,496 L780,520 L90,520" fill="none" stroke="#2563EB" stroke-width="2"/>

  <rect x="90" y="546" width="260" height="50" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="220" y="576" font-size="13" fill="#1E293B" text-anchor="middle">第7章：Container Escape</text>
  <rect x="370" y="546" width="260" height="50" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="500" y="576" font-size="13" fill="#1E293B" text-anchor="middle">第8章：Lateral Movement</text>
  <rect x="650" y="546" width="260" height="50" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="780" y="568" font-size="13" fill="#1E293B" text-anchor="middle">第9章：Credential Access</text>
  <text x="780" y="584" font-size="13" fill="#1E293B" text-anchor="middle">/ Exfiltration</text>

  <path d="M90,521 L90,546" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <path d="M350,571 L370,571" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <path d="M630,571 L650,571" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- transition Part2 -> Part3 -->
  <path d="M780,596 L780,620 L220,620 L220,834" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Part3 nodes -->
  <rect x="90" y="882" width="260" height="50" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="220" y="905" font-size="13" fill="#1E293B" text-anchor="middle">第10章：Falco・eBPFに</text>

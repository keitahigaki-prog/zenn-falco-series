  <!-- Legend -->
  <rect x="60" y="1000" width="880" height="30" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <line x1="80" y1="1015" x2="120" y2="1015" stroke="#2563EB" stroke-width="2"/>
  <text x="128" y="1019" font-size="12" fill="#1E293B">読み進める順序（実線＝章の連なり）</text>

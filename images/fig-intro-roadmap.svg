  <text x="90" y="428" font-size="14" font-weight="600" fill="#0F172A">Part 2 — 攻撃チェーンの再現（MITRE ATT&amp;CK for Containers）</text>

  <rect x="60" y="836" width="880" height="150" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>

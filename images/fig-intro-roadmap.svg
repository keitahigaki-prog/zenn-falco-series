  <rect x="370" y="196" width="260" height="50" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="500" y="226" font-size="13" fill="#1E293B" text-anchor="middle">第2章：MITRE ATT&amp;CK for Containers</text>
  <rect x="650" y="196" width="260" height="50" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>

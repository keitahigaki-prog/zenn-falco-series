      <path d="M0,0 L10,5 L0,10 Z" fill="#2563EB"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="1040" fill="#FFFFFF"/>
  <text x="500" y="38" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">図0-1　本書の地図</text>

  <!-- Part band backgrounds -->
  <rect x="60" y="150" width="880" height="214" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="90" y="178" font-size="14" font-weight="600" fill="#0F172A">Part 1 — 準備</text>


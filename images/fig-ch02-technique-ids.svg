<svg viewBox="0 0 1100 320" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans JP','Inter',sans-serif">
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563EB"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1100" height="320" fill="#FFFFFF"/>
  <text x="550" y="36" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">図2-2　テクニックIDとサブテクニックの関係</text>

  <!-- standalone technique for comparison -->
  <rect x="60" y="100" width="280" height="80" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="200" y="130" font-size="14" fill="#1E293B" text-anchor="middle">T1611</text>
  <text x="200" y="150" font-size="12" fill="#1E293B" text-anchor="middle">Escape to Host</text>
  <text x="200" y="168" font-size="11" fill="#1E293B" text-anchor="middle">（戦術: Privilege Escalation）</text>

  <rect x="20" y="70" width="360" height="140" rx="10" fill="none" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="40" y="60" font-size="12" fill="#64748B">サブテクニックを持たない例</text>

  <!-- T1552 tree -->
  <rect x="480" y="70" width="280" height="70" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="620" y="98" font-size="14" fill="#1E293B" text-anchor="middle">T1552</text>
  <text x="620" y="118" font-size="12" fill="#1E293B" text-anchor="middle">Unsecured Credentials</text>
  <text x="620" y="134" font-size="11" fill="#1E293B" text-anchor="middle">（戦術: Credential Access）</text>

  <path d="M620,140 L620,160 L650,160 L650,194" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <path d="M620,140 L620,160 L870,160 L870,194" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <rect x="500" y="194" width="300" height="70" rx="8" fill="#FFFFFF" stroke="#06B6D4" stroke-width="2"/>
  <text x="650" y="222" font-size="13" fill="#1E293B" text-anchor="middle">T1552.007</text>
  <text x="650" y="240" font-size="12" fill="#1E293B" text-anchor="middle">Container API</text>
  <text x="650" y="256" font-size="11" fill="#1E293B" text-anchor="middle">（サブテクニック）</text>

  <rect x="820" y="194" width="300" height="70" rx="8" fill="#06B6D4" stroke="#06B6D4" stroke-width="2"/>
  <text x="970" y="218" font-size="13" fill="#FFFFFF" text-anchor="middle">T1552.005</text>
  <text x="970" y="236" font-size="12" fill="#FFFFFF" text-anchor="middle">Cloud Instance</text>
  <text x="970" y="252" font-size="12" fill="#FFFFFF" text-anchor="middle">Metadata API</text>
</svg>

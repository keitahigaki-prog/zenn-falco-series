<svg viewBox="0 0 1500 220" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans JP','Inter',sans-serif">
  <defs>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#EF4444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1500" height="220" fill="#FFFFFF"/>
  <text x="750" y="34" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">図1-3　本書の実験ラボで扱う攻撃チェーン</text>

  <!-- 7 boxes in a row -->
  <g font-size="13" fill="#1E293B" text-anchor="middle">
    <rect x="20"  y="70" width="190" height="60" rx="8" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.5"/>
    <text x="115" y="96">Initial Access</text><text x="115" y="114" font-size="11">(Lab 1-4)</text>

    <rect x="230" y="70" width="190" height="60" rx="8" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.5"/>
    <text x="325" y="96">Execution</text><text x="325" y="114" font-size="11">(Lab 5-6)</text>

    <rect x="440" y="70" width="190" height="60" rx="8" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.5"/>
    <text x="535" y="96">Privilege Escalation</text><text x="535" y="114" font-size="11">(Lab 7-9)</text>

    <rect x="650" y="70" width="190" height="60" rx="8" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.5"/>
    <text x="745" y="96">Container Escape</text><text x="745" y="114" font-size="11">(Lab 10-12)</text>

    <rect x="860" y="70" width="190" height="60" rx="8" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.5"/>
    <text x="955" y="96">Lateral Movement</text><text x="955" y="114" font-size="11">(Lab 13-15)</text>

    <rect x="1070" y="70" width="200" height="60" rx="8" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.5"/>
    <text x="1170" y="90">Credential Access</text><text x="1170" y="106">/ Exfiltration</text><text x="1170" y="122" font-size="11">(Lab 16-17)</text>

    <rect x="1290" y="70" width="190" height="60" rx="8" fill="#0F172A" stroke="#0F172A" stroke-width="1.5"/>
    <text x="1385" y="96" fill="#FFFFFF">追跡・評価</text><text x="1385" y="114" font-size="11" fill="#FFFFFF">(第10-11章)</text>
  </g>

  <g stroke="#EF4444" stroke-width="2" fill="none" marker-end="url(#arrowRed)">
    <path d="M210,100 L230,100"/>
    <path d="M420,100 L440,100"/>
    <path d="M630,100 L650,100"/>
    <path d="M840,100 L860,100"/>
    <path d="M1050,100 L1070,100"/>
    <path d="M1270,100 L1290,100"/>
  </g>

  <rect x="20" y="170" width="700" height="30" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <line x1="40" y1="185" x2="80" y2="185" stroke="#EF4444" stroke-width="2"/>
  <text x="88" y="189" font-size="12" fill="#1E293B">赤枠＝攻撃チェーンの各フェーズ（MITRE ATT&amp;CK for Containers準拠）</text>
</svg>

<svg viewBox="0 0 1100 420" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans JP','Inter',sans-serif">
  <defs>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#EF4444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1100" height="420" fill="#FFFFFF"/>
  <text x="550" y="36" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">図7-1　コンテナランタイムの境界モデルが崩れる条件</text>

  <rect x="400" y="70" width="300" height="56" rx="8" fill="#0F172A" stroke="#0F172A" stroke-width="1.5"/>
  <text x="550" y="96" font-size="13" fill="#FFFFFF" text-anchor="middle">通常のコンテナ</text>
  <text x="550" y="114" font-size="11" fill="#FFFFFF" text-anchor="middle">（Namespace分離 + 最小Capabilities）</text>

  <rect x="80"  y="190" width="300" height="56" rx="8" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.5"/>
  <text x="230" y="214" font-size="13" fill="#1E293B" text-anchor="middle">特権コンテナ化</text>
  <text x="230" y="232" font-size="11" fill="#1E293B" text-anchor="middle">（privileged: true）</text>

  <rect x="400" y="190" width="300" height="56" rx="8" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.5"/>
  <text x="550" y="214" font-size="13" fill="#1E293B" text-anchor="middle">共有Namespace/Volume</text>
  <text x="550" y="232" font-size="11" fill="#1E293B" text-anchor="middle">（hostPID, hostNetwork, hostPath）</text>

  <rect x="720" y="190" width="300" height="56" rx="8" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.5"/>
  <text x="870" y="214" font-size="13" fill="#1E293B" text-anchor="middle">ランタイム自体の脆弱性</text>
  <text x="870" y="232" font-size="11" fill="#1E293B" text-anchor="middle">（CVE悪用）</text>

  <path d="M480,126 L230,170 L230,190" fill="none" stroke="#EF4444" stroke-width="2" marker-end="url(#arrowRed)"/>
  <path d="M550,126 L550,190" fill="none" stroke="#EF4444" stroke-width="2" marker-end="url(#arrowRed)"/>
  <path d="M620,126 L870,170 L870,190" fill="none" stroke="#EF4444" stroke-width="2" marker-end="url(#arrowRed)"/>
  <rect x="300" y="146" width="70" height="18" fill="#FFFFFF" opacity="0.9"/>
  <text x="304" y="160" font-size="11" fill="#1E293B">設定ミス</text>
  <rect x="780" y="146" width="90" height="18" fill="#FFFFFF" opacity="0.9"/>
  <text x="784" y="160" font-size="11" fill="#1E293B">パッチ未適用</text>

  <rect x="400" y="330" width="300" height="56" rx="8" fill="#EF4444" stroke="#EF4444" stroke-width="1.5"/>
  <text x="550" y="364" font-size="14" fill="#FFFFFF" text-anchor="middle">Host Escape 成立</text>

  <path d="M230,246 L230,300 L480,330" fill="none" stroke="#EF4444" stroke-width="2" marker-end="url(#arrowRed)"/>
  <path d="M550,246 L550,330" fill="none" stroke="#EF4444" stroke-width="2" marker-end="url(#arrowRed)"/>
  <path d="M870,246 L870,300 L620,330" fill="none" stroke="#EF4444" stroke-width="2" marker-end="url(#arrowRed)"/>
</svg>
